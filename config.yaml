# ─────────────────────────────────────────────────────────────
# TradeOS — BTC Futures Agent configuration
# Edit these values to tune the agent. No code changes needed.
# ─────────────────────────────────────────────────────────────

mode: PAPER            # PAPER = simulated fills, no API orders.
                       # DELTA_DEMO = real orders on Delta testnet (needs .env keys).

market:
  # One Delta product per active strategy. Delta nets positions by product, so this
  # mapping lets strategies own independent live positions while
  # still sharing the account's equity and deterministic risk controls.
  # Delta testnet currently has no BNBUSD contract; 1000SHIBUSD fills that slot.
  symbol: [ETHUSD, DOGEUSD, ADAUSD, 1000SHIBUSD, SOLUSD]
  resolution: "15m"    # base feed for BTC EMA 15m; other assignments fetch
                        # their own configured timeframe independently
  lookback: 300        # how many recent candles to pull each cycle

loop:
  poll_seconds: 15     # closed-candle strategies; protects API quota across 7 products

execution:
  shadow_paper: false  # Delta-only: no simulated strategy execution lanes

# ── Strategy selection ──
# Every installed live strategy runs in the same combo, fetching its own
# candles independently (see strategies/combo.py) so they don't have to
# share one resolution. Each strategy is restricted to one unique Delta
# product, preventing strategies from merging or reversing each other's
# positions. Trade journal/analytics tag each by `tag` for comparison.
#   - mean_reversion: 15m low-ADX Bollinger-band extremes confirmed by RSI,
#     with an ATR stop, middle-band target, and 32-bar time-stop.
#   - donchian_breakout: 15m volume-confirmed channel breakout. ONLY on
#     DOGEUSD — a 1-year holdout backtest (see research.py) confirmed real
#     positive expectancy there (+6.9% net, 26% win rate, 84 trades), but
#     the SAME strategy lost heavily on every other coin it was tried on
#     with large, trustworthy samples: BTCUSD -32.6% (194 holdout trades),
#     XRPUSD -25.8% (183 holdout trades), ETHUSD -11.0% (93 trades). The
#     edge is specific to DOGEUSD, not a property of the strategy itself —
#     do not re-add this to another symbol without backtesting that symbol
#     specifically first. BTCUSD and XRPUSD are paused (removed from
#     market.symbol below) pending a real replacement strategy; they are
#     not currently trading anything.
#   - btc_bms: 5m price-action zone rejection with structure exits.
#   - time_series_momentum: 1h multi-horizon momentum with EMA confirmation.
#   - darkknight_sol: 4H EMA50/200 trend filter + support/resistance breakout,
#     RSI + volume confirmation, fixed SL/TP from entry. Reconstructed from a
#     public TradingView listing's description (source is invite-only, so
#     this is an independent approximation, not a verified reproduction) —
#     see strategies/darkknight_sol.py for every judgment call made.
#
# A live Delta account has one net position per symbol. The `symbols` field on
# each sub-strategy gives it exclusive ownership of its product, so all active
# strategies can hold live Delta positions concurrently when setups trigger.
strategy:
  name: combo
  params:
    subs:
      - { name: mean_reversion, tag: mean_reversion, symbols: [ETHUSD] }
      - { name: donchian_breakout, tag: donchian_breakout, symbols: [DOGEUSD] }
      - { name: btc_bms, tag: btc_bms, symbols: [ADAUSD] }
      - { name: time_series_momentum, tag: time_series_momentum, symbols: [1000SHIBUSD] }
      - { name: darkknight_sol, tag: darkknight_sol, symbols: [SOLUSD] }

# ── Risk engine (applies to every trade) ──
risk:
  account_equity: 10000.0   # starting equity for PAPER mode (USD)
  risk_per_trade_pct: 0.5   # hard ceiling; each strategy has a lower/equal cap below
  stop_loss_pct: 1.0        # stop-loss distance from entry (%) — every trade still gets one
  take_profit_pct: 2.0      # take-profit distance from entry (%) — 1:2 risk:reward
  # Every limit below is lifted (set very high) so the bot can take any number
  # of trades without being blocked — per-trade stop-loss/take-profit above
  # still applies to every single trade regardless.
  max_leverage: 1000          # account-wide gross exposure ceiling — effectively unlimited
  max_daily_loss_pct: 99      # halt new entries for the UTC day after this loss — effectively unlimited (capped below 100% by design)
  max_portfolio_risk_pct: 99  # combined entry-to-stop risk across all positions — effectively unlimited (capped below 100% by design)
  max_open_positions: 1000     # account-wide position count limit — effectively unlimited
  max_same_direction_positions: 1000 # avoid stacking correlated crypto bets — effectively unlimited
  max_consecutive_losses: 100000 # pause a strategy after this many consecutive losses — effectively unlimited
  strategy_cooldown_minutes: 240 # automatic strategy pause duration (irrelevant while the above is unlimited)
  min_reward_risk: 1.5       # reject entries offering less than 1.5R
  max_stop_distance_pct: 5.0 # reject abnormally wide or malformed stops
  strategy_risk_pct:         # percent of current account equity per new trade
    mean_reversion: 0.25
    donchian_breakout: 0.25
    btc_bms: 0.25
    time_series_momentum: 0.25
    darkknight_sol: 0.25

logging:
  level: INFO               # DEBUG INFO WARNING ERROR
  trade_log: logs/trades.csv

# ── AI (Google Gemini) ──
# Needs GEMINI_API_KEY in .env (get one at https://aistudio.google.com/apikey).
# Override the model with GEMINI_MODEL in .env (default: gemini-3.8-flash).
ai:
  narrate: true             # AI writes a one-line "why" into the live feed on each trade
