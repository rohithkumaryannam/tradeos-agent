# ─────────────────────────────────────────────────────────────
# TradeOS — BTC Futures Agent configuration
# Edit these values to tune the agent. No code changes needed.
# ─────────────────────────────────────────────────────────────

mode: PAPER            # PAPER = simulated fills, no API orders.
                       # DELTA_DEMO = real orders on Delta testnet (needs .env keys).

market:
  symbol: [BTCUSD, ETHUSD]   # trades all listed symbols concurrently, sharing
                             # one account's equity/daily cap. SOLUSD dropped —
                             # any still-open SOLUSD position keeps its exchange
                             # bracket (SL/TP) and closes on its own regardless.
                             # A single value (e.g. "BTCUSD") also works.
  resolution: "5m"     # ema_crossover's timeframe (it self-heals to 5m on
                       # startup if set to anything else)
  lookback: 300        # how many recent candles to pull each cycle

loop:
  poll_seconds: 5      # how often the agent wakes up and evaluates

execution:
  shadow_paper: true   # compare the same signals with simulated fills alongside demo

# ── Strategy selection ──
# Two EMA 9/20 crossover instances running genuinely in parallel on their
# own timeframes (5m and 15m) — each fetches its own candles independently
# (see strategies/combo.py), so they don't have to share one resolution.
# Both are stop-and-reverse: a down-cross while long closes the long and
# immediately flips into a short on the next cycle, and vice versa. No
# trend/chop filter — every cross is traded.
#
# `symbols` dedicates each instance to its own market (ema_5m -> BTCUSD only,
# ema_15m -> ETHUSD only), so they never compete for the same position —
# without this, the faster 5m instance gets ~3x more chances to grab any
# given symbol and the 15m one rarely gets to trade at all. Dedicating
# symbols guarantees both actually run, for a fair side-by-side comparison
# (trade journal/analytics tag each by `tag`: ema_5m / ema_15m).
#
# donchian_breakout (plain string sub, no `symbols` restriction) would apply
# to every market and run on the base resolution (ema_5m's "5m", since it's
# listed first) — add it back with:
#   subs: [{name: ema_crossover, params: {resolution: "5m"}, tag: ema_5m, symbols: [BTCUSD]},
#          {name: ema_crossover, params: {resolution: "15m"}, tag: ema_15m, symbols: [ETHUSD]},
#          donchian_breakout]
# (donchian needs 15m+, so put an ema_crossover 15m instance first instead
#  if you want donchian to share its feed, or give donchian its own
#  resolution the same way the ema instances do.)
strategy:
  name: combo
  params:
    subs:
      - { name: ema_crossover, params: { resolution: "5m" }, tag: ema_5m, symbols: [BTCUSD] }
      - { name: ema_crossover, params: { resolution: "15m" }, tag: ema_15m, symbols: [ETHUSD] }

# ── Risk engine (applies to every trade) ──
risk:
  account_equity: 10000.0   # starting equity for PAPER mode (USD)
  risk_per_trade_pct: 0.5   # hard ceiling; each strategy has a lower/equal cap below
  stop_loss_pct: 1.0        # stop-loss distance from entry (%) — every trade still gets one
  take_profit_pct: 2.0      # take-profit distance from entry (%) — 1:2 risk:reward
  # Every limit below is lifted (set very high) so the bot can take any number
  # of trades without being blocked — per-trade stop-loss/take-profit above
  # still applies to every single trade regardless.
  max_leverage: 1000          # account-wide gross exposure ceiling — effectively unlimited
  max_daily_loss_pct: 99      # halt new entries for the UTC day after this loss — effectively unlimited (capped below 100% by design)
  max_portfolio_risk_pct: 99  # combined entry-to-stop risk across all positions — effectively unlimited (capped below 100% by design)
  max_open_positions: 1000     # account-wide position count limit — effectively unlimited
  max_same_direction_positions: 1000 # avoid stacking correlated crypto bets — effectively unlimited
  max_consecutive_losses: 100000 # pause a strategy after this many consecutive losses — effectively unlimited
  strategy_cooldown_minutes: 240 # automatic strategy pause duration (irrelevant while the above is unlimited)
  min_reward_risk: 1.5       # reject entries offering less than 1.5R
  max_stop_distance_pct: 5.0 # reject abnormally wide or malformed stops
  strategy_risk_pct:         # percent of current account equity per new trade
    ema_5m: 0.25
    ema_15m: 0.25

logging:
  level: INFO               # DEBUG INFO WARNING ERROR
  trade_log: logs/trades.csv

# ── AI (Google Gemini) ──
# Needs GEMINI_API_KEY in .env (get one at https://aistudio.google.com/apikey).
# Override the model with GEMINI_MODEL in .env (default: gemini-3.8-flash).
ai:
  narrate: true             # AI writes a one-line "why" into the live feed on each trade
