# ─────────────────────────────────────────────────────────────
# TradeOS — BTC Futures Agent configuration
# Edit these values to tune the agent. No code changes needed.
# ─────────────────────────────────────────────────────────────

mode: PAPER            # PAPER = simulated fills, no API orders.
                       # DELTA_DEMO = real orders on Delta testnet (needs .env keys).

market:
  # One Delta product per active strategy. Delta nets positions by product, so this
  # mapping lets strategies own independent live positions while
  # still sharing the account's equity and deterministic risk controls.
  # Delta testnet currently has no BNBUSD contract; 1000SHIBUSD fills that slot.
  symbol: [BTCUSD, ETHUSD, XRPUSD, DOGEUSD, ADAUSD, SOLUSD]
  resolution: "15m"    # base feed for BTC EMA 15m; other assignments fetch
                        # their own configured timeframe independently
  lookback: 300        # how many recent candles to pull each cycle

loop:
  poll_seconds: 15     # closed-candle strategies; protects API quota across 7 products

execution:
  shadow_paper: false  # Delta-only: no simulated strategy execution lanes

# ── Strategy selection ──
# Every installed live strategy runs in the same combo, fetching its own
# candles independently (see strategies/combo.py) so they don't have to
# share one resolution. Each strategy is restricted to one unique Delta
# product, preventing strategies from merging or reversing each other's
# positions. Trade journal/analytics tag each by `tag` for comparison.
#   - mean_reversion: 15m low-ADX Bollinger-band extremes confirmed by RSI,
#     with an ATR stop, middle-band target, and 32-bar time-stop.
#   - donchian_breakout: 15m volume-confirmed channel breakout. Run on
#     DOGEUSD/XRPUSD (tags donchian_breakout/donchian_xrp) as of 2026-10-31
#     — BTCUSD moved to mastermind (below). A 1-year holdout backtest (see
#     research.py) confirmed real positive expectancy on DOGEUSD (+6.9%
#     net, 26% win rate, 84 trades), but the SAME strategy lost heavily on
#     BTCUSD (-32.6%, 194 holdout trades) and XRPUSD (-25.8%, 183 holdout
#     trades) on equally large samples. BTC/XRP were reinstated at the
#     user's explicit request despite this evidence — there is no
#     backtested edge for either, this was a known, accepted risk, not a
#     recommendation. Live data confirmed the backtest on BTC specifically:
#     135 trades since the Oct 24 ledger correction put donchian_btc at 25%
#     win rate, profit factor 0.46, -$11.01 — the single biggest drag on
#     the account, which is why BTC was moved off it. XRP's version of the
#     same strategy stayed modestly positive live (donchian_xrp: 36.8% win
#     rate, PF 1.1, +$2.06), so XRP/DOGE are unchanged.
#     Both remaining subs override fallback_tp_mult to 2.0 (default 8.0) at
#     the user's request, 2026-10-24 — they felt the default's ~8:1
#     fallback TP distance was too wide and asked for a 1:2 risk:reward
#     specifically (matching the risk engine's own stop_loss_pct/
#     take_profit_pct default ratio below). The real exit is still the
#     trailing Donchian channel cross, not this TP; this only pulls in the
#     rarely-hit fallback bracket order. Stop-loss distance (atr_stop_mult)
#     is unchanged.
#   - mastermind: NY-session (12AM-4AM New York) opening-range breakout
#     with a structural invalidation/re-arm cascade instead of a one-shot
#     stop — see strategies/mastermind.py for the full spec and judgment
#     calls. Designed by the user from a live BTC trade example (BOS/CHoCH
#     structure chart) specifically to replace donchian_btc's confirmed
#     live underperformance (above) with something that treats a failed
#     breakout as information (flip direction) instead of just eating the
#     stop. Assigned to BTCUSD 2026-10-31. No backtest exists yet — this is
#     a fresh design based on the user's own discretionary read of BTC
#     price action, not backtested evidence; same "known, accepted risk"
#     framing as the rest of this account's symbol assignments until it's
#     been run and evaluated on real trades.
#   - btc_bms: 5m price-action zone rejection with structure exits.
#   - time_series_momentum: 1h multi-horizon momentum with EMA confirmation.
#     Was on 1000SHIBUSD; removed 2026-10-23 at the user's request after
#     live losses. time_series_momentum itself is still installed but not
#     currently assigned to any symbol.
#   - paused: no-op strategy (never enters). SOLUSD's slot (tag
#     darkknight_sol, kept for continuity) was switched to this 2026-10-31
#     at the user's request — darkknight_sol ran there since 2026-10-24
#     unbacktested, and the user wants to reconsider the symbol later. The
#     switch was applied with an open SOLUSD position still live; left
#     alone to close on its own existing exchange-side stop/target per the
#     user's explicit choice, since darkknight_sol's own in-position
#     behavior was already a no-op (pure exchange-bracket exit) — swapping
#     strategies didn't change anything about how that specific trade gets
#     managed.
#   - darkknight_sol (strategy module): 4H EMA50/200 trend filter +
#     support/resistance breakout, RSI + volume confirmation, fixed SL/TP
#     from entry. Reconstructed from a public TradingView listing's
#     description (source is invite-only, so this is an independent
#     approximation, not a verified reproduction) — see
#     strategies/darkknight_sol.py. Not assigned to any symbol as of
#     2026-10-31 — still installed and selectable via the dashboard's
#     per-coin panel.
#
# A live Delta account has one net position per symbol. The `symbols` field on
# each sub-strategy gives it exclusive ownership of its product, so all active
# strategies can hold live Delta positions concurrently when setups trigger.
strategy:
  name: combo
  params:
    subs:
      - { name: mastermind, tag: donchian_btc, symbols: [BTCUSD] }
      - { name: mean_reversion, tag: mean_reversion, symbols: [ETHUSD] }
      - { name: donchian_breakout, tag: donchian_xrp, symbols: [XRPUSD], params: { fallback_tp_mult: 2.0 } }
      - { name: donchian_breakout, tag: donchian_breakout, symbols: [DOGEUSD], params: { fallback_tp_mult: 2.0 } }
      - { name: btc_bms, tag: btc_bms, symbols: [ADAUSD] }
      - { name: paused, tag: darkknight_sol, symbols: [SOLUSD] }

# ── Risk engine (applies to every trade) ──
risk:
  account_equity: 10000.0   # starting equity for PAPER mode (USD)
  risk_per_trade_pct: 0.5   # hard ceiling; each strategy has a lower/equal cap below
  stop_loss_pct: 1.0        # stop-loss distance from entry (%) — every trade still gets one
  take_profit_pct: 2.0      # take-profit distance from entry (%) — 1:2 risk:reward
  # Every limit below is lifted (set very high) so the bot can take any number
  # of trades without being blocked — per-trade stop-loss/take-profit above
  # still applies to every single trade regardless.
  max_leverage: 1000          # account-wide gross exposure ceiling — effectively unlimited
  max_daily_loss_pct: 99      # halt new entries for the UTC day after this loss — effectively unlimited (capped below 100% by design)
  max_portfolio_risk_pct: 99  # combined entry-to-stop risk across all positions — effectively unlimited (capped below 100% by design)
  max_open_positions: 1000     # account-wide position count limit — effectively unlimited
  max_same_direction_positions: 1000 # avoid stacking correlated crypto bets — effectively unlimited
  max_consecutive_losses: 100000 # pause a strategy after this many consecutive losses — effectively unlimited
  strategy_cooldown_minutes: 240 # automatic strategy pause duration (irrelevant while the above is unlimited)
  min_reward_risk: 1.5       # reject entries offering less than 1.5R
  max_stop_distance_pct: 5.0 # reject abnormally wide or malformed stops
  strategy_risk_pct:         # percent of current account equity per new trade
    donchian_btc: 0.25
    donchian_xrp: 0.25
    mean_reversion: 0.25
    donchian_breakout: 0.25
    btc_bms: 0.25
    darkknight_sol: 0.25

logging:
  level: INFO               # DEBUG INFO WARNING ERROR
  trade_log: logs/trades.csv

# ── AI (Google Gemini) ──
# Needs GEMINI_API_KEY in .env (get one at https://aistudio.google.com/apikey).
# Override the model with GEMINI_MODEL in .env (default: gemini-3.8-flash).
ai:
  narrate: true             # AI writes a one-line "why" into the live feed on each trade
